<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Sourcing Ledger — Aggregate Rehydration & Audit Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-brand">
        <div class="header-top-row">
          <h1 class="dashboard-title">Append-Only Event Ledger & Rehydration</h1>
          <span class="version-pill">PORT 8094</span>
        </div>
        <p class="dashboard-sub">
          Immutable event store where state is deterministically reconstructed from raw domain events with optimistic concurrency protection.
        </p>
      </div>

      <div class="header-status-pill">
        <span class="pulse-dot"></span>
        <span>LEDGER ACTIVE</span>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="errorBanner" style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #fb7185; padding: 0.75rem 1rem; border-radius: 8px; font-family: var(--font-mono); font-size: 0.8rem;">
    </div>

    <!-- Rehydrated State Hero Card -->
    <section id="accountHeroContainer" class="account-hero-card">
      <!-- Populated dynamically by AccountCard.js -->
    </section>

    <!-- Ledger & Commands Grid -->
    <main class="ledger-grid">
      <!-- Left Column: Command Dispatcher -->
      <section class="panel-card">
        <div class="panel-header">
          <h2 class="panel-title">Dispatch Domain Command</h2>
          <span class="panel-subtitle">Appends Event</span>
        </div>

        <div id="commandForm" class="command-form">
          <div class="form-group">
            <label class="form-label" for="txnAmount">Transaction Amount ($)</label>
            <input type="number" id="txnAmount" class="form-control" value="2500" min="1" step="50">
          </div>

          <div class="form-group">
            <label class="form-label" for="txnReason">Audit Memo / Description</label>
            <input type="text" id="txnReason" class="form-control" value="Treasury Yield Transfer">
          </div>

          <div class="button-grid">
            <button id="btnDeposit" class="btn btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Deposit
            </button>
            <button id="btnWithdraw" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Withdraw
            </button>
            <button id="btnFreeze" class="btn btn-warning">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              Freeze
            </button>
            <button id="btnUnfreeze" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
              Unfreeze
            </button>
          </div>
        </div>
      </section>

      <!-- Right Column: Chronological Event Ledger -->
      <section class="panel-card">
        <div class="panel-header">
          <h2 class="panel-title">Immutable Event Stream</h2>
          <span class="panel-subtitle">Chronological History</span>
        </div>

        <div id="eventTimelineContainer" class="timeline-stream">
          <!-- Populated dynamically by EventTimeline.js -->
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
